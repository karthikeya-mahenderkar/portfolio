<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found — Karthikeya Mahenderkar</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      try {
        var t = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
        document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
    <style>
      :root {
        --bg: #0b0b0a;
        --fg: #f1ede4;
        --muted: #a39e92;
        --subtle: #8a857a;
        --line: rgb(241 237 228 / 0.12);
        --accent: #ff7a3d;
        --accent-fg: #160a04;
        --grid: rgb(241 237 228 / 0.035);
      }
      [data-theme='light'] {
        --bg: #f6f4ef;
        --fg: #141311;
        --muted: #5c5850;
        --subtle: #6f6a60;
        --line: rgb(20 19 17 / 0.14);
        --accent: #d9480f;
        --accent-fg: #fff;
        --grid: rgb(20 19 17 / 0.05);
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: var(--bg);
        color: var(--fg);
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        background-image:
          radial-gradient(ellipse at center, transparent 30%, var(--bg) 75%),
          linear-gradient(to right, var(--grid) 1px, transparent 1px),
          linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
        background-size: auto, 56px 56px, 56px 56px;
        -webkit-font-smoothing: antialiased;
      }
      main { max-width: 34rem; text-align: center; }
      .code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--subtle);
      }
      .code b { color: var(--accent); font-weight: 500; }
      h1 {
        margin: 20px 0 12px;
        font-size: clamp(2.5rem, 9vw, 4.5rem);
        line-height: 1;
        letter-spacing: -0.04em;
        font-weight: 500;
      }
      h1 i { font-family: Georgia, 'Times New Roman', serif; font-weight: 400; color: var(--muted); }
      h1 span { color: var(--accent); }
      p { margin: 0 auto; max-width: 26rem; color: var(--muted); line-height: 1.6; }
      .log {
        margin: 28px auto 0;
        max-width: 24rem;
        padding: 14px 16px;
        border: 1px solid var(--line);
        border-radius: 14px;
        text-align: left;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        line-height: 1.8;
        color: var(--subtle);
      }
      .log .bad { color: #ef4444; }
      .log .ok { color: var(--accent); }
      a.btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 28px;
        height: 44px;
        padding: 0 22px;
        border-radius: 999px;
        background: var(--fg);
        color: var(--bg);
        font-size: 14px;
        font-weight: 500;
        text-decoration: none;
        transition: background-color 0.3s, color 0.3s;
      }
      a.btn:hover { background: var(--accent); color: var(--accent-fg); }
      a.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="code"><b>404</b> · Not found</div>
      <h1>Route <i>not found</i><span>.</span></h1>
      <p>This page doesn’t exist, or it moved. Nothing was oversold, duplicated or lost on the way.</p>
      <div class="log" aria-hidden="true">
        &gt; GET <span id="path">/unknown</span><br />
        &gt; <span class="bad">404: no matching route</span><br />
        &gt; <span class="ok">redirect suggested → /</span>
      </div>
      <a class="btn" href="/">← Back to the portfolio</a>
    </main>
    <script>
      try {
        document.getElementById('path').textContent = location.pathname.slice(0, 40) || '/'
      } catch (e) {}
    </script>
  </body>
</html>
